<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LLM World</title>
<style>
  body { margin: 0; background: #1b1b24; color: #e8e8e8; font: 14px monospace; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
  canvas { image-rendering: pixelated; border: 2px solid #444; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">connecting…</div>
<script>
const SCALE = 3;
const COLORS = { player: "#4fc3f7", npc: "#ffb74d", floor: "#6a9a4a", wall: "#3d3d4d" };
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let init = null, state = null;

const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onopen = () => document.getElementById("status").textContent = "방향키로 이동";
ws.onclose = () => document.getElementById("status").textContent = "disconnected";
ws.onmessage = (ev) => {
  const msg = JSON.parse(ev.data);
  if (msg.type === "init") {
    init = msg;
    canvas.width = msg.map[0].length * msg.tile * SCALE;
    canvas.height = msg.map.length * msg.tile * SCALE;
  } else if (msg.type === "state") {
    state = msg;
  }
};

const KEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
addEventListener("keydown", (e) => {
  const d = KEYS[e.key];
  if (!d || document.activeElement.tagName === "INPUT") return;
  e.preventDefault();
  ws.send(JSON.stringify({ type: "move", dx: d[0], dy: d[1] }));
});

function draw() {
  requestAnimationFrame(draw);
  if (!init) return;
  const T = init.tile * SCALE;
  ctx.imageSmoothingEnabled = false;
  init.map.forEach((row, y) => [...row].forEach((ch, x) => {
    ctx.fillStyle = ch === "#" ? COLORS.wall : COLORS.floor;
    ctx.fillRect(x * T, y * T, T, T);
  }));
  ctx.font = "bold 14px monospace";
  ctx.textAlign = "center";
  for (const l of init.landmarks) {
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.fillRect(l.x * T, l.y * T, T, T);
    ctx.fillStyle = "#fff";
    ctx.fillText(l.name, l.x * T + T / 2, l.y * T + T - 4);
  }
  if (!state) return;
  for (const e of state.entities) {
    const px = e.x * T, py = e.y * T;
    ctx.fillStyle = COLORS[e.kind];
    ctx.fillRect(px + 6, py + 6, T - 12, T - 12);
    ctx.fillStyle = "#fff";
    ctx.fillText(e.name, px + T / 2, py - 4);
  }
  for (const b of state.bubbles) {
    const e = state.entities.find((x) => x.id === b.id);
    if (!e) continue;
    const w = ctx.measureText(b.text).width + 12;
    const bx = e.x * T + T / 2 - w / 2, by = e.y * T - 40;
    ctx.fillStyle = "#fff";
    ctx.fillRect(bx, by, w, 20);
    ctx.fillStyle = "#000";
    ctx.fillText(b.text, e.x * T + T / 2, by + 15);
  }
}
draw();
</script>
</body>
</html>
