<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LLM World</title>
<style>
  body { margin: 0; background: #1b1b24; color: #e8e8e8; font: 14px monospace; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
  canvas { image-rendering: pixelated; border: 2px solid #444; }
  input { font: 14px monospace; padding: 4px 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<input id="say" maxlength="80" size="50" placeholder="Enter로 말하기 (근처 NPC가 듣는다)">
<div id="status">connecting…</div>
<script>
const SCALE = 3;
// 8×8 도트 스프라이트. 문자 → 팔레트 색, "." = 투명
const SPRITES = {
  floor: ["gggggggg", "ggGggggg", "gggggGgg", "gggggggg", "gGgggggg", "ggggggGg", "gggGgggg", "gggggggg"],
  wall:  ["bbbbbbbB", "bbbbbbbB", "BBBBBBBB", "bbbBbbbb", "bbbBbbbb", "BBBBBBBB", "bbbbbbbB", "bbbbbbbB"],
  mark:  ["........", ".yyyyyy.", ".y....y.", ".y....y.", ".y....y.", ".y....y.", ".yyyyyy.", "........"],
  char:  ["..hhhh..", ".hhhhhh.", ".hsese..", ".hssss..", "..cccc..", ".scccccs", "..cccc..", "..f..f.."],
};
const PALETTE = { g: "#5f9b45", G: "#4d8238", b: "#7a6a5a", B: "#5a4c40", y: "rgba(255,230,120,0.6)",
  s: "#f1c79a", e: "#222", f: "#3a2a20" };
const LOOKS = { player: { h: "#2b2b2b", c: "#3fa7e0" }, mina: { h: "#8a3b1e", c: "#e0607a" }, tom: { h: "#d8d8d8", c: "#e0a040" } };
function sprite(name, x, y, T, extra = {}) {
  const px = T / 8;
  SPRITES[name].forEach((row, j) => [...row].forEach((ch, i) => {
    const col = extra[ch] || PALETTE[ch];
    if (ch === "." || !col) return;
    ctx.fillStyle = col;
    ctx.fillRect(x + i * px, y + j * px, px, px);
  }));
}
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let init = null, state = null;

const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onopen = () => document.getElementById("status").textContent = "방향키로 이동";
ws.onclose = () => document.getElementById("status").textContent = "disconnected";
ws.onmessage = (ev) => {
  const msg = JSON.parse(ev.data);
  if (msg.type === "init") {
    init = msg;
    canvas.width = msg.map[0].length * msg.tile * SCALE;
    canvas.height = msg.map.length * msg.tile * SCALE;
  } else if (msg.type === "state") {
    state = msg;
  }
};

const sayBox = document.getElementById("say");
sayBox.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !sayBox.value.trim()) return;
  ws.send(JSON.stringify({ type: "say", text: sayBox.value }));
  sayBox.value = "";
  sayBox.blur();
});

const KEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
addEventListener("keydown", (e) => {
  const d = KEYS[e.key];
  if (!d || document.activeElement.tagName === "INPUT") return;
  e.preventDefault();
  ws.send(JSON.stringify({ type: "move", dx: d[0], dy: d[1] }));
});

function draw() {
  requestAnimationFrame(draw);
  if (!init) return;
  const T = init.tile * SCALE;
  ctx.imageSmoothingEnabled = false;
  init.map.forEach((row, y) => [...row].forEach((ch, x) => {
    sprite(ch === "#" ? "wall" : "floor", x * T, y * T, T);
  }));
  ctx.font = "bold 14px monospace";
  ctx.textAlign = "center";
  for (const l of init.landmarks) {
    sprite("mark", l.x * T, l.y * T, T);
    ctx.fillStyle = "#fff8c0";
    ctx.fillText(l.name, l.x * T + T / 2, l.y * T + T + 14);
  }
  if (!state) return;
  for (const e of state.entities) {
    const px = e.x * T, py = e.y * T;
    sprite("char", px, py, T, LOOKS[e.id] || LOOKS.player);
    ctx.fillStyle = "#fff";
    ctx.fillText(e.name, px + T / 2, py - 4);
  }
  for (const b of state.bubbles) {
    const e = state.entities.find((x) => x.id === b.id);
    if (!e) continue;
    const w = ctx.measureText(b.text).width + 12;
    const bx = Math.max(0, Math.min(canvas.width - w, e.x * T + T / 2 - w / 2)), by = e.y * T - 40;
    ctx.fillStyle = "#fff";
    ctx.fillRect(bx, by, w, 20);
    ctx.fillStyle = "#000";
    ctx.fillText(b.text, bx + w / 2, by + 15);
  }
}
draw();
</script>
</body>
</html>
