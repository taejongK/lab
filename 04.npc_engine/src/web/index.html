<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  :root {
    color-scheme: dark;
    --ink: #241c2e; --night: #1b1a2e; --parchment: #f3e7c4; --shade: #c9b98a; --gold: #d8a93a; --dim: #8d84a0;
    font-family: Galmuri11, "Apple SD Gothic Neo", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--night); color: var(--parchment); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; }
  #frame { position: relative; width: min(100%, 720px); aspect-ratio: 240 / 176; container-type: inline-size; overflow: hidden; outline: 4px solid var(--ink); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; background: #000; }

  /* 양피지 창: 2단 도트 테두리 */
  .win {
    position: absolute; background: var(--parchment); color: var(--ink);
    font-size: 3.05cqw; line-height: 1.45; padding: 2.2cqw 2.6cqw;
    border: .85cqw solid var(--ink); box-shadow: inset 0 0 0 .55cqw var(--shade);
  }
  #plate { left: 2cqw; top: 2cqw; padding: 1cqw 2.2cqw; }
  #area { left: 2cqw; top: 2cqw; padding: 1cqw 2.2cqw; }
  #dialog { left: 0; right: 0; bottom: 0; height: 33cqw; overflow-y: auto; }
  #frame.has-cmd #dialog { right: 36cqw; }
  #frame:not(.has-cmd) #dialog { height: auto; min-height: 13cqw; max-height: 33cqw; }
  #dialog p { margin: 0; white-space: pre-wrap; }
  #next { position: absolute; right: 2cqw; bottom: 1cqw; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #cmd { right: 0; bottom: 0; width: 36cqw; height: 33cqw; overflow-y: auto; padding: 1.4cqw; display: flex; flex-direction: column; }
  #cmd button {
    all: unset; display: block; padding: .5cqw .5cqw .5cqw 3.8cqw; position: relative; cursor: pointer; line-height: 1.3;
  }
  #cmd button:focus-visible, #cmd button:focus, #cmd button:hover { background: var(--shade); }
  #cmd button:focus::before { content: "▶"; position: absolute; left: .5cqw; }
  #cmd button.ai { color: #8a2f1f; }
  #cmd button.ai::after { content: " ✦"; }
  #chatForm { margin-top: 1.4cqw; }
  #chatInput { width: 100%; font: inherit; color: inherit; background: #fff8e0; border: .4cqw solid var(--ink); padding: .6cqw 1cqw; }
  #chatInput:focus { outline: .4cqw solid var(--gold); }
  #journal { inset: 3cqw; overflow-y: auto; }
  #journal h2 { font: inherit; font-size: 3.6cqw; margin: 0 0 1.4cqw; }
  #journal ul { list-style: none; margin: 0; padding: 0; }
  #journal li { padding: .8cqw 0; border-bottom: .3cqw dotted var(--shade); }
  #journal li.announced { color: #8a2f1f; }
  #journal li.heard { color: #4a3a6e; }
  #help { font-size: 13px; color: var(--dim); text-align: center; }
  kbd { font: inherit; color: var(--parchment); }
  #help a { color: var(--gold); }
  #debug { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
  #debug button { font: inherit; background: var(--ink); color: var(--parchment); border: 2px solid var(--dim); padding: 4px 8px; cursor: pointer; }
  #debug button:focus-visible { outline: 2px solid var(--gold); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #next { animation: none; } }
</style>
</head>
<body>
<div id="frame">
  <canvas id="c" width="240" height="176" aria-label="게임 화면"></canvas>
  <div id="area" class="win" hidden></div>
  <div id="plate" class="win" hidden></div>
  <div id="dialog" class="win" hidden>
    <p id="text" aria-live="polite"></p><span id="next" hidden>▼</span>
    <form id="chatForm" hidden><input id="chatInput" maxlength="500" placeholder="직접 말하기" aria-label="대사 입력" autocomplete="off"></form>
  </div>
  <div id="cmd" class="win" hidden></div>
  <section id="journal" class="win" hidden aria-label="기억"><h2>내가 아는 것</h2><ul id="journalList"></ul></section>
</div>
<p id="help"><kbd>방향키</kbd> 이동 &nbsp; <kbd>E</kbd> 인터랙션 &nbsp; <kbd>J</kbd> 기억 &nbsp; <kbd>Esc</kbd> 닫기 &nbsp; <a href="/">홈으로</a></p>
<div id="debug" hidden>
  <button data-notice="all">항상 발각</button>
  <button data-notice="none">항상 미발각</button>
  <button data-notice="">AI 판정</button>
  <span id="fires"></span>
</div>
<script>
const T = 16, VW = 240, VH = 176, BOX_H = 66;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);
const post = (path, body) => fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
const DIRS = {up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]};
const KEYS = {ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right"};

let assets, state;
let mode = "world";            // world | wipe | encounter | journal
const held = [];
const me = {room: null, x: 0, y: 0, px: 0, py: 0, dir: "down", step: 0, ready: false};
const others = {};             // id -> 화면 위치·방향
let pendingMoves = 0, tweenUntil = 0;

/* --- 도트: 데이터를 비트맵으로 굽는다 --- */
const baked = {};
function bake(sprite, frame) {
  const canvas = document.createElement("canvas"); canvas.width = canvas.height = T;
  const g = canvas.getContext("2d");
  sprite.frames[frame].forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === "." && !sprite.palette["."]) return;
    g.fillStyle = sprite.palette[ch]; g.fillRect(x, y, 1, 1);
  }));
  return canvas;
}
function bitmap(group, name, frame) {
  const key = `${group}/${name}/${frame}`;
  if (!baked[key]) baked[key] = bake(assets.sprites[group][name], frame);
  return baked[key];
}
function drawBitmap(bmp, x, y, {scale = 1, flip = false} = {}) {
  ctx.save(); ctx.translate(Math.round(x), Math.round(y));
  if (flip) { ctx.translate(T * scale, 0); ctx.scale(-1, 1); }
  ctx.drawImage(bmp, 0, 0, T * scale, T * scale); ctx.restore();
}
/* 걷기: 정면·뒷면은 좌우 반전을 번갈아, 옆면은 한 칸 튀어 오른다 */
function drawChar(id, a, moving, opts = {}) {
  const frame = a.dir === "up" ? "up" : a.dir === "down" ? "down" : "side";
  const alt = moving && a.step % 2 === 1;
  const flip = frame === "side" ? a.dir === "right" : alt;
  drawBitmap(bitmap("characters", id, frame), a.px * T + (opts.ox || 0), a.py * T + (opts.oy || 0) - (frame === "side" && alt ? 1 : 0) - 2, {flip});
}
function drawCorpse(id, x, y, scale = 1) {
  ctx.save(); ctx.translate(Math.round(x + T * scale / 2), Math.round(y + T * scale / 2)); ctx.rotate(Math.PI / 2);
  ctx.filter = "grayscale(.7)"; ctx.drawImage(bitmap("characters", id, "down"), -T * scale / 2, -T * scale / 2, T * scale, T * scale);
  ctx.restore();
}

/* --- 월드 --- */
const R = name => assets.rooms.find(r => r.name === name);
/* 카메라: 화면보다 큰 방은 나를 따라가고, 작은 방은 가운데에 둔다 */
const cam = (pos, size, view) => size <= view ? (size - view) / 2 : Math.max(0, Math.min(pos * T + 8 - view / 2, size - view));
function drawWorld(now) {
  const map = R(me.room).map, camX = cam(me.px, map[0].length * T, VW), camY = cam(me.py, map.length * T, VH);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, VW, VH);
  ctx.save(); ctx.translate(-Math.round(camX), -Math.round(camY));
  map.forEach((row, y) => [...row].forEach((ch, x) => {
    if (x * T - camX < -T || x * T - camX > VW || y * T - camY < -T || y * T - camY > VH) return;
    ctx.drawImage(bitmap("tiles", ch, "idle"), x * T, y * T);
  }));
  const here = state.room === me.room;  // 방을 건너간 직후 서버 상태가 오기 전에는 옛 방 사람을 그리지 않는다
  if (here) for (const o of state.objects) ctx.drawImage(bitmap("objects", o.id, "idle"), o.x * T, o.y * T);
  const list = [...(here ? state.people : []).map(p => ({...p, a: others[p.id]})), {id: assets.player, a: me, alive: true}]
    .filter(e => e.a).sort((p, q) => p.a.py - q.a.py);
  for (const e of list) {
    if (!e.alive) { drawCorpse(e.id, e.a.px * T, e.a.py * T); continue; }
    drawChar(e.id, e.a, e.a === me ? now < tweenUntil : e.a.moving);
  }
  ctx.restore();
}
function stepOthers(dt) {
  for (const p of state.people) {
    let a = others[p.id];
    if (!a) a = others[p.id] = {px: p.x, py: p.y, dir: "down", step: 0, moving: false};
    const dx = p.x - a.px, dy = p.y - a.py, dist = Math.abs(dx) + Math.abs(dy);
    if (dist === 0) { a.moving = false; continue; }
    if (dist > 2) { a.px = p.x; a.py = p.y; continue; }
    const gait = dt / 320;
    a.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    a.moving = true; a.step = Math.floor(performance.now() / 160);
    a.px += Math.abs(dx) <= gait ? dx : Math.sign(dx) * gait;
    a.py += Math.abs(dy) <= gait ? dy : Math.sign(dy) * gait;
  }
}
/* 서버 world.step과 같은 규칙: 문에 들어서면 건너편 방 문 위에 서고, 문 위에서 바깥으로 나가면 되돌아간다 */
function through(room, x, y) {
  const d = (R(room).doors || []).find(d => d.x === x && d.y === y);
  const back = d && R(d.to) && (R(d.to).doors || []).find(b => b.to === room);
  return back ? {room: d.to, x: back.x, y: back.y} : null;
}
function stepFrom(p, dir) {
  const [dx, dy] = DIRS[dir], map = R(p.room).map, x = p.x + dx, y = p.y + dy;
  if (y < 0 || y >= map.length || x < 0 || x >= map[0].length) return through(p.room, p.x, p.y);
  if (map[y][x] !== "." && map[y][x] !== "+") return null;
  return through(p.room, x, y) || {room: p.room, x, y};
}
function enterRoom(name) {
  if (name === me.room) return;
  me.room = name;
  if (state && mode === "world") { const a = $("area"); a.textContent = name; a.hidden = false; clearTimeout(a._t); a._t = setTimeout(() => a.hidden = true, 1600); }
}
function tryMove(now) {
  if (mode !== "world" || now < tweenUntil || !held.length) return;
  const dir = held[held.length - 1];
  me.dir = dir;
  const n = stepFrom(me, dir);
  if (!n) return;
  // 사람과 물건 위로는 못 지나간다. 다른 방 사정은 모르니 서버 판정에 맡긴다
  if (n.room === state.room && [...state.people, ...state.objects].some(e => e.x === n.x && e.y === n.y)) return;
  enterRoom(n.room); me.x = n.x; me.y = n.y; me.step++;
  tweenUntil = now + 170; pendingMoves++;
  post("/api/move", {dir}).finally(() => { pendingMoves--; });
}
function stepMe(now) {
  const remain = Math.max(0, tweenUntil - now) / 170, [dx, dy] = DIRS[me.dir];
  me.px = me.x - dx * remain; me.py = me.y - dy * remain;
}

/* --- 창 --- */
let typing = null, typedFull = "";
function say_(text, done) {
  clearInterval(typing); typedFull = text;
  const el = $("text"); $("dialog").hidden = false; $("next").hidden = true;
  if (reduced) { el.textContent = text; typing = null; done && done(); return; }
  let i = 0; el.textContent = "";
  typing = setInterval(() => {
    el.textContent = text.slice(0, ++i); $("dialog").scrollTop = $("dialog").scrollHeight;
    if (i >= text.length) { clearInterval(typing); typing = null; done && done(); }
  }, 24);
  typingDone = done;
}
let typingDone = null;
function finishTyping() {
  if (!typing) return false;
  clearInterval(typing); typing = null; $("text").textContent = typedFull; typingDone && typingDone();
  return true;
}

/* --- 소식: 내가 새로 알게 된 것이 월드 위에 뜬다 --- */
let seenKnown = 0, toastQueue = [], toastTimer = null;
function collectNews(s) {
  const fresh = s.known.slice(-(s.known_total - seenKnown) || s.known.length);
  if (s.known_total > seenKnown) {
    seenKnown = s.known_total;
    for (const m of fresh) if (!m.text.startsWith("내가 ")) toastQueue.push(m.text);
  }
}
function showToast() {
  if (mode !== "world" || toastTimer || !toastQueue.length) return;
  const text = toastQueue.shift();
  $("frame").classList.remove("has-cmd"); say_(text);
  toastTimer = setTimeout(() => { toastTimer = null; if (mode === "world") $("dialog").hidden = true; }, Math.max(3000, text.length * 90));
}

/* --- 인터랙션 화면 --- */
const enc = {target: null, actions: [], isChar: false, wipeStart: 0, wipeOut: false, waitLabel: null, waitUntil: 0, lines: []};
function findTarget() {
  const all = state.room === me.room ? [...state.people, ...state.objects] : [];
  const reach = e => {
    const d = Math.abs(e.x - me.x) + Math.abs(e.y - me.y);
    if (d <= 1) return true;
    return d === 2 && (e.x === me.x || e.y === me.y) && R(me.room).map[(e.y + me.y) / 2][(e.x + me.x) / 2] === "B";
  };
  const [dx, dy] = DIRS[me.dir], ahead = e => Math.sign(e.x - me.x) === dx && Math.sign(e.y - me.y) === dy;
  return all.filter(reach).sort((a, b) => ahead(b) - ahead(a))[0];
}
function startEncounter() {
  const t = findTarget();
  if (!t) { $("frame").classList.remove("has-cmd"); clearTimeout(toastTimer); say_("여기에는 말을 걸 상대가 없다."); toastTimer = setTimeout(() => { toastTimer = null; $("dialog").hidden = true; }, 1600); return; }
  clearTimeout(toastTimer); toastTimer = null; $("dialog").hidden = true;
  enc.target = t; enc.isChar = !state.objects.some(o => o.id === t.id); enc.actions = [];
  mode = "wipe"; enc.wipeStart = performance.now(); enc.wipeOut = false; held.length = 0;
  if (reduced) enterScene();
}
function drawWipe(now, drawUnder) {
  const dur = 320, f = Math.min(1, (now - enc.wipeStart) / dur), bars = 8;
  drawUnder(now);
  ctx.fillStyle = "#241c2e";
  const cover = enc.wipeOut ? 1 - f : f;
  for (let i = 0; i < bars; i++) {
    const h = VH / bars, wid = VW * cover;
    ctx.fillRect(i % 2 ? 0 : VW - wid, i * h, wid, h + 1);
  }
  if (f >= 1) {
    if (enc.wipeOut) mode = enc.nextMode || "encounter";
    else if (enc.onCover) { const go = enc.onCover; enc.onCover = null; enc.wipeOut = true; enc.wipeStart = now; go(); }
    else enterScene();
  }
}
async function enterScene() {
  mode = "wipe"; enc.wipeOut = true; enc.wipeStart = performance.now(); enc.nextMode = "encounter";
  if (reduced) mode = "encounter";
  $("plate").hidden = false; $("plate").textContent = enc.target.name;
  $("frame").classList.add("has-cmd");
  $("cmd").hidden = false; $("cmd").replaceChildren();
  const dead = enc.isChar && !enc.target.alive;
  say_(dead ? `${enc.target.name}은(는) 움직이지 않는다.` : enc.isChar ? `${enc.target.name}이(가) 이쪽을 본다.` : `${enc.target.name}이(가) 있다.`);
  const res = await post("/api/interact", {target: enc.target.id});
  if (!res.ok) { say_("상대가 자리를 떠났다."); showMenu([{label: "돌아가기", run: leaveScene}]); return; }
  enc.actions = (await res.json()).actions;
  showActions();
}
function showMenu(items) {
  $("cmd").hidden = false;
  $("cmd").replaceChildren(...items.map(i => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = i.label;
    if (i.ai) { b.className = "ai"; b.title = "지금 상황이라 할 수 있는 행동"; }
    b.onclick = i.run; return b;
  }));
  $("cmd").firstChild?.focus();
}
function showActions() {
  $("chatForm").hidden = true; $("frame").classList.add("has-cmd");
  showMenu([...enc.actions.map(a => ({label: a.label, ai: a.ai, run: () => choose(a)})), {label: "돌아가기", run: leaveScene}]);
}
async function choose(a) {
  if (a.id === "talk") return openChat();
  $("cmd").hidden = true; $("frame").classList.remove("has-cmd");
  const res = await post("/api/act", {target: enc.target.id, label: a.label});
  if (!res.ok) { $("frame").classList.add("has-cmd"); say_("지금은 할 수 없다."); showMenu([{label: "돌아가기", run: leaveScene}]); return; }
  say_("……"); enc.waitLabel = a.label; enc.waitUntil = performance.now() + 90000;
}
function checkOutcome(s) {
  if (!enc.waitLabel) return;
  const prefix = `내가 '${enc.waitLabel}'`, failed = `'${enc.waitLabel}'을(를) 시도했지만`;
  const hit = [...s.known].reverse().find(m => m.text.startsWith(prefix) || m.text.startsWith(failed));
  const late = performance.now() > enc.waitUntil;
  if (!hit && !late) return;
  enc.waitLabel = null;
  const text = !hit ? "아직 아무 일도 일어나지 않았다." : hit.text.replace(/^내가 '.*?'을\(를\) 했다\. 결과: /, "");
  say_(text, () => { $("next").hidden = false; });
  enc.waitDone = true;
}
function openChat() {
  $("chatForm").hidden = false; say_(`${enc.target.name}에게 뭐라고 말할까?`);
  $("frame").classList.add("has-cmd");
  showMenu([{label: "그만 말하기", run: closeChat}]);
  $("chatInput").value = ""; $("chatInput").focus();
}
function closeChat() { $("chatForm").hidden = true; say_(`${enc.target.name}이(가) 이쪽을 본다.`); showActions(); }
let talking = false;
async function say(text) {
  text = text.trim();
  if (!text || talking || mode !== "encounter") return;
  talking = true;
  say_("……"); $("cmd").replaceChildren();
  const res = await post("/api/say", {target: enc.target.id, text});
  talking = false;
  if (!res.ok) { say_("상대가 더는 듣지 않는다."); showMenu([{label: "돌아가기", run: leaveScene}]); return; }
  const r = await res.json();
  say_(r.speech);
  showMenu([...r.suggested_replies.map(s => ({label: s, run: () => say(s)})), {label: "그만 말하기", run: closeChat}]);
  $("chatInput").focus();
}
function leaveScene() {
  $("plate").hidden = true; $("cmd").hidden = true; $("dialog").hidden = true; $("chatForm").hidden = true;
  $("frame").classList.remove("has-cmd"); enc.waitLabel = null; enc.waitDone = false;
  document.activeElement?.blur();
  if (reduced) { mode = "world"; return; }
  mode = "wipe"; enc.wipeOut = true; enc.wipeStart = performance.now(); enc.nextMode = "world";
}
/* 인터랙션 무대: 방의 색을 깐 뒤, 상대는 크게 오른쪽 위, 나는 등을 보이며 왼쪽 아래 */
function drawScene(now) {
  const back = R(me.room).backdrop || "#4f4168";
  const floorY = 62;
  ctx.fillStyle = back; ctx.fillRect(0, 0, VW, floorY);
  ctx.fillStyle = "rgba(0,0,0,.28)";
  for (let y = 0; y < floorY; y += 2) for (let x = (y / 2) % 4; x < VW; x += 4) ctx.fillRect(x, y, 1, 1);
  ctx.fillStyle = "#c9b98a"; ctx.fillRect(0, floorY, VW, VH - floorY);
  ctx.fillStyle = "#a8986e";
  for (let y = floorY; y < VH; y += 2) for (let x = (y / 2) % 2 ? 0 : 3; x < VW; x += 6) ctx.fillRect(x, y, 1, 1);
  ctx.fillStyle = "#241c2e"; ctx.fillRect(0, floorY, VW, 1);
  const shadow = (cx, cy, rx) => {
    ctx.fillStyle = "rgba(36,28,46,.35)";
    for (let i = -rx; i <= rx; i += 1) { const h = Math.round(Math.sqrt(1 - (i / rx) ** 2) * 4); ctx.fillRect(cx + i, cy - h, 1, h * 2); }
  };
  const t = enc.target, S = 4, nx = 150, ny = 8, bob = reduced ? 0 : Math.floor(now / 500) % 2;
  shadow(nx + 32, ny + 62, 34);
  if (enc.isChar) {
    if (t.alive) drawBitmap(bitmap("characters", t.id, "down"), nx, ny + bob, {scale: S});
    else drawCorpse(t.id, nx, ny + 10, S);
  } else {
    drawBitmap(bitmap("objects", t.id, "idle"), nx, ny + 6, {scale: S});
  }
  shadow(46, 89, 26);
  drawBitmap(bitmap("characters", assets.player, "up"), 22, 43, {scale: 3});
}
function drawJournal() {
  $("journalList").replaceChildren(...state.known.slice().reverse().map(m => {
    const li = document.createElement("li"); li.textContent = m.text; li.className = m.kind; return li;
  }));
}

/* --- 서버 동기화 --- */
async function refresh() {
  const s = await (await fetch("/api/state")).json();
  if (!state) { me.room = s.player.room; me.x = me.px = s.player.x; me.y = me.py = s.player.y; seenKnown = s.known_total; }
  const moved = pendingMoves === 0 && performance.now() >= tweenUntil && (s.player.room !== me.room || s.player.x !== me.x || s.player.y !== me.y);
  if (moved) { enterRoom(s.player.room); me.x = me.px = s.player.x; me.y = me.py = s.player.y; }  // 감금 같은 서버 쪽 이동
  state = s;
  if (mode === "journal") drawJournal();
  if (s.debug && $("debug").hidden) {
    $("debug").hidden = false;
    $("fires").replaceChildren(...s.schedule.map(id => { const b = document.createElement("button"); b.dataset.fire = id; b.textContent = `일정 실행: ${id}`; return b; }));
  }
  document.title = s.ai_errors ? `${assets.title} (AI 오류 ${s.ai_errors}건)` : assets.title;
  checkOutcome(s);
  if (mode === "world") { collectNews(s); showToast(); } 
}

/* --- 입력 --- */
addEventListener("keydown", e => {
  if (!state) return;
  const k = e.key;
  if (mode === "journal") { if (k === "Escape" || k === "j" || k === "J") { mode = "world"; $("journal").hidden = true; } return; }
  if (mode === "encounter") {
    const inInput = e.target === $("chatInput");
    if (k === "Escape") {
      if (enc.waitDone || enc.waitLabel) return leaveScene();
      return $("chatForm").hidden ? leaveScene() : closeChat();
    }
    if (inInput) {
      if (k === "ArrowDown") { e.preventDefault(); $("cmd").firstChild?.focus(); }
      return;
    }
    if (enc.waitDone && (k === "Enter" || k === "e" || k === "E" || k === " ")) {
      e.preventDefault();
      if (!finishTyping()) leaveScene();
      return;
    }
    if ((k === "Enter" || k === " ") && finishTyping()) { e.preventDefault(); return; }
    if (k === "e" || k === "E") { e.preventDefault(); document.activeElement?.click?.(); return; }
    if (k === "ArrowUp" || k === "ArrowDown") {
      e.preventDefault();
      const items = [...$("cmd").children], i = items.indexOf(document.activeElement);
      if (k === "ArrowUp" && i === 0 && !$("chatForm").hidden) return $("chatInput").focus();
      items[(i + (k === "ArrowDown" ? 1 : -1) + items.length) % items.length]?.focus();
    }
    return;
  }
  if (mode !== "world") return;
  if (KEYS[k]) { e.preventDefault(); if (!held.includes(KEYS[k])) held.push(KEYS[k]); tryMove(performance.now()); }
  else if (k === "e" || k === "E" || k === "Enter") { e.preventDefault(); startEncounter(); }
  else if (k === "j" || k === "J") { mode = "journal"; drawJournal(); $("journal").hidden = false; }
});
addEventListener("keyup", e => { const i = held.indexOf(KEYS[e.key]); if (i >= 0) held.splice(i, 1); });
addEventListener("blur", () => { held.length = 0; });
$("chatForm").onsubmit = e => { e.preventDefault(); const v = $("chatInput").value; $("chatInput").value = ""; say(v); };
$("frame").addEventListener("click", e => { if (mode === "encounter" && enc.waitDone && !e.target.closest("button")) { if (!finishTyping()) leaveScene(); } });
$("debug").onclick = e => {
  const d = e.target.dataset;
  if (d.fire) post("/api/debug", {fire: d.fire});
  if (d.notice !== undefined) post("/api/debug", {notice: d.notice || null});
};

/* --- 그리기 루프 --- */
let lastFrame = performance.now();
function frame(now) {
  const dt = now - lastFrame; lastFrame = now;
  if (state) {
    stepOthers(dt);
    tryMove(now); stepMe(now);
    if (mode === "encounter") drawScene(now);
    else if (mode === "wipe") drawWipe(now, enc.wipeOut && enc.nextMode !== "world" ? drawScene : drawWorld);
    else drawWorld(now);
  }
  requestAnimationFrame(frame);
}
(async () => {
  assets = await (await fetch("/api/assets")).json();
  await refresh();
  setInterval(refresh, 400);
  requestAnimationFrame(frame);
})();
</script>
