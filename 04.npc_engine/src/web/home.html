<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPC 엔진</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  :root {
    color-scheme: dark;
    --ink: #241c2e; --night: #1b1a2e; --parchment: #f3e7c4; --shade: #c9b98a; --gold: #d8a93a; --red: #8a2f1f;
    font-family: Galmuri11, "Apple SD Gothic Neo", monospace; font-size: 15px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; background: var(--night); color: var(--parchment); display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .win { background: var(--parchment); color: var(--ink); border: 5px solid var(--ink); box-shadow: inset 0 0 0 3px var(--shade); }

  #menu { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  #menu h1 { font: inherit; font-size: 40px; margin: 0; color: var(--gold); text-shadow: 3px 3px 0 var(--ink); }
  #commands { display: flex; flex-direction: column; padding: 12px; min-width: 300px; }
  #commands a, #commands button { all: unset; display: block; position: relative; padding: 12px 12px 12px 38px; font-size: 18px; cursor: pointer; }
  #commands a:hover, #commands a:focus, #commands button:hover, #commands button:focus { background: var(--shade); }
  #commands a:focus::before, #commands button:focus::before { content: "▶"; position: absolute; left: 12px; }

  #select { width: min(100%, 1040px); }
  #select header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  #select h2 { font: inherit; font-size: 22px; margin: 0; }
  #back { font: inherit; color: var(--ink); background: var(--shade); border: 2px solid var(--ink); padding: 6px 12px; cursor: pointer; }
  #back:hover { background: var(--gold); }
  #error { color: var(--gold); margin: 0 0 12px; }
  #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 16px; text-align: left; font: inherit; width: 100%; height: 100%; }
  .actions { display: flex; gap: 8px; }
  .actions button, .actions a { font: inherit; font-size: 15px; color: var(--ink); background: var(--shade); border: 2px solid var(--ink); padding: 6px 14px; cursor: pointer; text-decoration: none; }
  .actions button { background: var(--gold); }
  .actions button:hover, .actions a:hover { background: #fff8e0; }
  .faces { display: flex; flex-wrap: wrap; gap: 2px; min-height: 48px; }
  .faces canvas { width: 48px; height: 48px; image-rendering: pixelated; }
  .card h3 { font: inherit; font-size: 18px; margin: 0; }
  .card p { margin: 0; line-height: 1.55; }
  .story { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; min-height: 4.65em; }
  .meta { color: #6a5d7c; font-size: 13px; margin-top: auto !important; }
  .draft { opacity: .8; }
  .draft .meta { color: var(--red); }
  .draft a { color: var(--red); }
  #empty a { color: var(--gold); }
</style>
</head>
<body>
<section id="menu">
  <h1>NPC 엔진</h1>
  <nav id="commands" class="win">
    <a href="/create">게임 만들기</a>
    <button id="choose" type="button">게임 선택하기</button>
  </nav>
</section>
<section id="select" hidden>
  <header><button id="back" type="button">돌아가기</button><h2>게임 선택하기</h2></header>
  <p id="error" role="alert" hidden></p>
  <p id="empty" hidden>아직 만든 게임이 없습니다. <a href="/create">게임 만들기</a></p>
  <div id="cards"></div>
</section>
<script>
const $ = id => document.getElementById(id);
function h(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
}
function face(sprite) {
  const c = h("canvas", {width: 16, height: 16}), g = c.getContext("2d");
  sprite.rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === "." && !sprite.palette["."]) return;
    g.fillStyle = sprite.palette[ch]; g.fillRect(x, y, 1, 1);
  }));
  return c;
}
async function play(game) {
  $("error").hidden = true;
  const res = await fetch("/api/play", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({name: game.name})});
  if (res.ok) { location.href = "/play"; return; }
  $("error").textContent = `'${game.title}'을(를) 시작하지 못했습니다.`; $("error").hidden = false;
}
function card(game) {
  const kids = [h("div", {className: "faces"}, ...game.faces.map(face)), h("h3", {textContent: game.title}), h("p", {className: "story", textContent: game.story})];
  const edit = h("a", {href: `/create?name=${encodeURIComponent(game.name)}`, textContent: "수정하기"});
  if (!game.problems) {
    return h("div", {className: "card win"}, ...kids,
      h("p", {className: "meta", textContent: `캐릭터 ${game.characters}명, 방 ${game.rooms}개`}),
      h("div", {className: "actions"}, h("button", {type: "button", textContent: "플레이", onclick: () => play(game)}), edit));
  }
  if (game.broken) return h("div", {className: "card win draft"}, ...kids);
  return h("div", {className: "card win draft"}, ...kids,
    h("p", {className: "meta"}, `아직 플레이할 수 없습니다. 고칠 내용 ${game.problems}건. `, h("a", {href: `/create?name=${encodeURIComponent(game.name)}`, textContent: "게임 만들기에서 고치기"})));
}
$("choose").onclick = async () => {
  $("menu").hidden = true; $("select").hidden = false;
  const {games} = await (await fetch("/api/games")).json();
  $("empty").hidden = games.length > 0;
  $("cards").replaceChildren(...games.map(card));
  ($("cards").querySelector("button") || $("back")).focus();
};
$("back").onclick = () => { $("select").hidden = true; $("menu").hidden = false; $("choose").focus(); };
addEventListener("keydown", e => { if (e.key === "Escape" && !$("select").hidden) $("back").click(); });
document.querySelector("#commands a").focus();
</script>
</body>
</html>
